<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DARK // CONTROL — Secure Access</title>

<style>
/* =========================================================
   DARK CONTROL // CYBERPUNK LOGIN
   ========================================================= */

:root {
    --bg: #020608;
    --bg-2: #050b0e;
    --panel: rgba(5, 14, 17, 0.92);

    --green: #00ff9c;
    --green-2: #00c878;
    --cyan: #00eaff;

    --red: #ff174f;

    --text: #d9fff1;
    --muted: #5d8178;

    --border: rgba(0, 255, 156, 0.18);
    --border-strong: rgba(0, 255, 156, 0.55);

    --shadow-green: rgba(0, 255, 156, 0.25);
    --shadow-cyan: rgba(0, 234, 255, 0.18);
}

/* RESET */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(0, 255, 156, 0.045),
            transparent 35%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(0, 234, 255, 0.035),
            transparent 30%
        ),
        #020608;

    color: var(--text);

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
}

/* =========================================================
   BACKGROUND GRID
   ========================================================= */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(0, 255, 156, 0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0, 255, 156, 0.035) 1px,
            transparent 1px
        );

    background-size: 42px 42px;

    mask-image:
        radial-gradient(
            ellipse at center,
            black 20%,
            transparent 80%
        );

    animation: gridMove 18s linear infinite;
}

@keyframes gridMove {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(42px);
    }
}

/* =========================================================
   SCANLINES
   ========================================================= */

body::after {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(0, 255, 156, 0.018) 4px
        );

    opacity: 0.7;
}

/* =========================================================
   FLOATING GLOW
   ========================================================= */

.glow {
    position: fixed;

    width: 420px;
    height: 420px;

    border-radius: 50%;

    background: rgba(0, 255, 156, 0.045);

    filter: blur(80px);

    pointer-events: none;

    animation: floatGlow 7s ease-in-out infinite;
}

.glow.one {
    top: -180px;
    left: -120px;
}

.glow.two {
    bottom: -200px;
    right: -120px;

    background: rgba(0, 234, 255, 0.035);

    animation-delay: -3s;
}

@keyframes floatGlow {

    0%,
    100% {
        transform: translate(0, 0) scale(1);
    }

    50% {
        transform: translate(30px, 25px) scale(1.08);
    }
}

/* =========================================================
   MAIN CARD
   ========================================================= */

.card {
    position: relative;

    width: min(455px, 94vw);

    padding: 34px;

    background:
        linear-gradient(
            145deg,
            rgba(0, 255, 156, 0.035),
            transparent 35%
        ),
        var(--panel);

    border: 1px solid var(--border);

    border-radius: 18px;

    backdrop-filter: blur(16px);

    box-shadow:
        0 0 0 1px rgba(0, 255, 156, 0.025),
        0 25px 80px rgba(0, 0, 0, 0.75),
        0 0 70px rgba(0, 255, 156, 0.045);

    overflow: hidden;

    animation: cardIn 0.8s ease both;
}

@keyframes cardIn {

    from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =========================================================
   ANIMATED BORDER
   ========================================================= */

.card::before {
    content: "";

    position: absolute;

    top: -2px;
    left: -50%;

    width: 200%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--green),
            var(--cyan),
            var(--green),
            transparent
        );

    filter:
        drop-shadow(0 0 8px var(--green))
        drop-shadow(0 0 18px var(--green));

    animation: borderMove 4s linear infinite;
}

@keyframes borderMove {
    from {
        transform: translateX(-25%);
    }

    to {
        transform: translateX(25%);
    }
}

/* Bottom glow */

.card::after {
    content: "";

    position: absolute;

    bottom: 0;
    left: 20%;

    width: 60%;
    height: 1px;

    background: var(--green);

    box-shadow:
        0 0 10px var(--green),
        0 0 25px var(--green);

    opacity: 0.5;
}

/* =========================================================
   TOP STATUS
   ========================================================= */

.status-bar {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 28px;

    font-family:
        "Courier New",
        monospace;

    font-size: 10px;

    letter-spacing: 0.12em;

    color: var(--muted);

    direction: ltr;
}

.status {
    display: flex;
    align-items: center;

    gap: 7px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 6px var(--green),
        0 0 14px var(--green);

    animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {

    0%,
    100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: 0.4;
        transform: scale(0.75);
    }
}

/* =========================================================
   HEADER
   ========================================================= */

.logo {
    text-align: center;

    margin-bottom: 6px;

    font-family:
        "Courier New",
        monospace;

    font-size: 25px;

    font-weight: 800;

    letter-spacing: 0.14em;

    color: var(--green);

    text-shadow:
        0 0 7px rgba(0, 255, 156, 0.65),
        0 0 22px rgba(0, 255, 156, 0.25);
}

.logo span {
    color: var(--cyan);

    text-shadow:
        0 0 8px rgba(0, 234, 255, 0.6),
        0 0 20px rgba(0, 234, 255, 0.2);
}

.subtitle {
    text-align: center;

    color: var(--muted);

    font-family:
        "Courier New",
        monospace;

    font-size: 10px;

    letter-spacing: 0.16em;

    margin-bottom: 30px;

    direction: ltr;
}

/* =========================================================
   TERMINAL LINE
   ========================================================= */

.terminal-line {
    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 25px;

    padding: 9px 11px;

    background: rgba(0, 255, 156, 0.025);

    border-right: 2px solid var(--green);

    color: var(--green);

    font-family:
        "Courier New",
        monospace;

    font-size: 11px;

    direction: ltr;

    box-shadow:
        inset 0 0 20px rgba(0, 255, 156, 0.018);
}

.cursor {
    width: 7px;
    height: 13px;

    background: var(--green);

    box-shadow: 0 0 8px var(--green);

    animation: cursorBlink 1s steps(2) infinite;
}

@keyframes cursorBlink {
    50% {
        opacity: 0;
    }
}

/* =========================================================
   FORM
   ========================================================= */

.field {
    position: relative;

    margin-bottom: 20px;
}

label {
    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 8px;

    color: #71968c;

    font-family:
        "Courier New",
        monospace;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 0.1em;

    direction: ltr;

    text-transform: uppercase;
}

label::before {
    content: ">";
    color: var(--green);

    text-shadow:
        0 0 8px var(--green);
}

/* =========================================================
   INPUT
   ========================================================= */

.input-wrap {
    position: relative;
}

.input-wrap::before {
    content: "";

    position: absolute;

    right: 0;
    top: 0;

    width: 3px;
    height: 100%;

    background: var(--green);

    opacity: 0;

    box-shadow:
        0 0 10px var(--green);

    transition:
        opacity 0.25s ease;
}

.input-wrap:focus-within::before {
    opacity: 1;
}

input {
    width: 100%;

    height: 50px;

    padding:
        0 16px;

    background:
        linear-gradient(
            90deg,
            rgba(0, 255, 156, 0.018),
            rgba(0, 255, 156, 0.005)
        );

    border: 1px solid rgba(0, 255, 156, 0.13);

    border-radius: 8px;

    outline: none;

    color: var(--green);

    font-family:
        "Courier New",
        monospace;

    font-size: 14px;

    direction: ltr;

    text-align: left;

    caret-color: var(--green);

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}

input::placeholder {
    color: #34544c;

    opacity: 1;
}

input:hover {
    border-color:
        rgba(0, 255, 156, 0.28);
}

input:focus {
    border-color:
        rgba(0, 255, 156, 0.7);

    background:
        rgba(0, 255, 156, 0.035);

    box-shadow:
        0 0 0 1px rgba(0, 255, 156, 0.08),
        0 0 18px rgba(0, 255, 156, 0.08),
        inset 0 0 18px rgba(0, 255, 156, 0.025);
}

/* =========================================================
   PASSWORD
   ========================================================= */

#p {
    letter-spacing: 0.18em;
}

/* =========================================================
   LOGIN BUTTON
   ========================================================= */

button {
    position: relative;

    width: 100%;

    height: 53px;

    margin-top: 8px;

    border: 1px solid
        rgba(0, 255, 156, 0.65);

    border-radius: 8px;

    overflow: hidden;

    cursor: pointer;

    color: #00150d;

    background:
        linear-gradient(
            110deg,
            var(--green),
            #19ffb1,
            var(--cyan),
            var(--green)
        );

    background-size: 300% 100%;

    font-family:
        "Courier New",
        monospace;

    font-size: 12px;

    font-weight: 900;

    letter-spacing: 0.14em;

    direction: ltr;

    box-shadow:
        0 0 12px rgba(0, 255, 156, 0.22),
        0 0 35px rgba(0, 255, 156, 0.08);

    transition:
        transform 0.15s ease,
        box-shadow 0.25s ease;

    animation:
        buttonGradient 4s linear infinite;
}

@keyframes buttonGradient {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

button::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 70%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.4),
            transparent
        );

    transform: skewX(-20deg);

    animation: buttonScan 2.8s linear infinite;
}

@keyframes buttonScan {
    0% {
        left: -100%;
    }

    55%,
    100% {
        left: 150%;
    }
}

button::after {
    content: "";

    position: absolute;

    inset: -3px;

    border-radius: inherit;

    border: 1px solid var(--green);

    opacity: 0;

    box-shadow:
        0 0 15px var(--green),
        0 0 30px var(--green);

    animation: buttonPulse 2s ease-in-out infinite;
}

@keyframes buttonPulse {

    0%,
    100% {
        opacity: 0.1;
    }

    50% {
        opacity: 0.7;
    }
}

button:hover {
    transform: translateY(-1px);

    box-shadow:
        0 0 18px rgba(0, 255, 156, 0.45),
        0 0 45px rgba(0, 255, 156, 0.18),
        0 0 80px rgba(0, 234, 255, 0.08);
}

button:active {
    transform: scale(0.985);
}

/* =========================================================
   ERROR
   ========================================================= */

#error-box {
    min-height: 24px;

    margin-top: 15px;

    text-align: center;
}

#err {
    color: var(--red);

    font-family:
        "Courier New",
        monospace;

    font-size: 11px;

    font-weight: 700;

    text-shadow:
        0 0 8px rgba(255, 23, 79, 0.45);

    direction: rtl;
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 25px;

    padding-top: 16px;

    border-top:
        1px solid rgba(0, 255, 156, 0.08);

    color: #36544d;

    font-family:
        "Courier New",
        monospace;

    font-size: 9px;

    letter-spacing: 0.08em;

    direction: ltr;
}

.secure {
    color: #4b7569;
}

.secure::before {
    content: "◆ ";

    color: var(--green);

    text-shadow:
        0 0 8px var(--green);
}

/* =========================================================
   LOADING STATE
   ========================================================= */

button.loading {
    pointer-events: none;

    opacity: 0.85;
}

button.loading .button-text {
    opacity: 0;
}

button.loading .loader {
    opacity: 1;
}

.loader {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 6px;

    opacity: 0;

    color: #00150d;

    font-size: 11px;
}

.loader span {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #00150d;

    animation:
        loader 0.9s infinite ease-in-out;
}

.loader span:nth-child(2) {
    animation-delay: 0.15s;
}

.loader span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes loader {

    0%,
    80%,
    100% {
        transform: scale(0.6);
        opacity: 0.45;
    }

    40% {
        transform: scale(1.2);
        opacity: 1;
    }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 520px) {

    body {
        padding: 16px;
    }

    .card {
        padding: 25px 20px;
        border-radius: 14px;
    }

    .logo {
        font-size: 21px;
    }

    .status-bar {
        font-size: 8px;
    }

    input {
        height: 48px;
    }

    button {
        height: 51px;
    }
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<!-- Background -->

<div class="glow one"></div>
<div class="glow two"></div>


<!-- LOGIN -->

<form
    class="card"
    id="f"
    autocomplete="off"
    novalidate
>

    <!-- STATUS -->

    <div class="status-bar">

        <div class="status">
            <span class="status-dot"></span>
            SYSTEM ONLINE
        </div>

        <div>
            SECURE ACCESS
        </div>

    </div>


    <!-- HEADER -->

    <div class="logo">
        DARK <span>//</span> CONTROL
    </div>

    <div class="subtitle">
        لوحة التحكم بالأجهزة 💀
    </div>


    <!-- TERMINAL -->

    <div class="terminal-line">
        <span>root@dark-control:~$</span>
        <span>authenticate</span>
        <span class="cursor"></span>
    </div>


    <!-- USERNAME -->

    <div class="field">

        <label for="u">
            اسم المستخدم
        </label>

        <div class="input-wrap">

            <input
                id="u"
                name="username"
                type="text"
                required
                maxlength="32"
                autocapitalize="off"
                autocomplete="username"
                spellcheck="false"
                placeholder="admin"
            >

        </div>

    </div>


    <!-- PASSWORD -->

    <div class="field">

        <label for="p">
            كلمة السر
        </label>

        <div class="input-wrap">

            <input
                id="p"
                name="password"
                type="password"
                required
                maxlength="128"
                autocomplete="current-password"
                placeholder="••••••••••••"
            >

        </div>

    </div>


    <!-- BUTTON -->

    <button
        id="loginBtn"
        type="submit"
    >

        <span class="button-text">
            تسجيل الدخول
        </span>

        <span class="loader">
            AUTHENTICATING
            <span></span>
            <span></span>
            <span></span>
        </span>

    </button>


    <!-- ERROR -->

    <div id="error-box">
        <div id="err"></div>
    </div>


    <!-- FOOTER -->

    <div class="footer">

        <span>
            DARK_CONTROL v1.0
        </span>

        <span class="secure">
            CONNECTION ENCRYPTED
        </span>

    </div>

</form>


<script>

/* =========================================================
   LOGIN
   ========================================================= */

const form = document.getElementById("f");
const username = document.getElementById("u");
const password = document.getElementById("p");

const error = document.getElementById("err");
const loginBtn = document.getElementById("loginBtn");


form.addEventListener("submit", async (e) => {

    e.preventDefault();

    error.textContent = "";

    const user = username.value.trim();
    const pass = password.value;

    /* Basic validation */

    if (!user || !pass) {

        error.textContent =
            "⚠ يرجى إدخال اسم المستخدم وكلمة المرور.";

        return;
    }


    /* Loading */

    loginBtn.classList.add("loading");


    try {

        const res = await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                username: user,

                password: pass

            })

        });


        /* Authentication failed */

        if (!res.ok) {

            error.textContent =
                "✖ فشل المصادقة: بيانات الدخول غير صحيحة.";

            loginBtn.classList.remove("loading");

            password.value = "";

            password.focus();

            return;
        }


        const data = await res.json();


        /* Token */

        if (!data.token) {

            error.textContent =
                "✖ الخادم لم يُرجع رمز المصادقة.";

            loginBtn.classList.remove("loading");

            return;
        }


        sessionStorage.setItem(
            "tk",
            data.token
        );


        /* Redirect */

        location.href = "/panel.html";


    } catch (ex) {

        console.error(ex);

        error.textContent =
            "✖ حدث خطأ في الاتصال بالخادم.";

        loginBtn.classList.remove("loading");

    }

});


/* =========================================================
   ENTER KEY / AUTO FOCUS
   ========================================================= */

window.addEventListener("load", () => {

    username.focus();

});


/* =========================================================
   SMALL TERMINAL EFFECT
   ========================================================= */

const terminal = document.querySelector(
    ".terminal-line span:nth-child(2)"
);

const messages = [
    "authenticate",
    "verify_identity",
    "establish_secure_session"
];

let messageIndex = 0;

setInterval(() => {

    messageIndex =
        (messageIndex + 1) % messages.length;

    terminal.textContent =
        messages[messageIndex];

}, 3000);

</script>

</body>
</html>
