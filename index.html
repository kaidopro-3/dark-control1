<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👻 GHOST SPY // Control Panel</title>
    <style>
    :root {
        --bg: #030506;
        --panel: #080d0f;
        --green: #00ff88;
        --blue: #00aaff;
        --red: #ff174f;
        --yellow: #ffeb3b;
        --purple: #9c27b0;
        --text: #e7f5f0;
        --muted: #71847f;
        --border: rgba(0,255,136,0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Segoe UI", Tahoma, sans-serif; min-height: 100vh; overflow-x: hidden; padding: 10px; }

    .container { max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

    /* الهيدر العلوي */
    header {
        background: var(--panel);
        border: 1px solid var(--green);
        border-radius: 12px;
        padding: 15px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 15px;
        box-shadow: 0 0 20px rgba(0,255,136,0.2);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--green);
        padding: 6px 16px;
        border-radius: 10px;
        background: #050a08;
        box-shadow: 0 0 10px rgba(0,255,136,0.25);
    }

    .brand-icon { font-size: 20px; }
    
    header h1 {
        font-family: "Courier New", monospace;
        font-size: 18px;
        font-weight: bold;
        color: var(--green);
        text-shadow: 0 0 10px var(--green);
    }

    .device-name-display {
        color: var(--yellow);
        font-size: 14px;
        font-weight: bold;
    }

    .device-selector {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .device-selector select {
        background: #050a08;
        color: var(--yellow);
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        outline: none;
    }

    .delete-btn {
        background: #1a0508;
        color: var(--red);
        border: 1px solid var(--red);
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 13px;
    }

    .logout-btn {
        background: rgba(255,23,79,0.1);
        color: var(--red);
        border: 1px solid rgba(255,23,79,0.3);
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
    }

    /* شريط الحالة */
    .status-bar {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 20px;
        display: flex;
        justify-content: space-around;
        gap: 15px;
        font-size: 13px;
    }

    .status-item .label { color: var(--muted); margin-left: 5px; }
    .status-item .value { color: var(--green); font-weight: bold; }
    #networkStatus { color: var(--red); }

    /* تخطيط لوحة التحكم الرئيسية */
    .dashboard-layout {
        display: flex;
        gap: 15px;
        align-items: flex-start;
    }

    @media (max-width: 900px) {
        .dashboard-layout { flex-direction: column-reverse; }
    }

    /* منطقة عرض المحتوى (يسار) */
    .tab-content {
        flex: 1;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        min-height: 550px;
        width: 100%;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .tab-pane h3 {
        color: var(--yellow);
        font-size: 16px;
        margin-bottom: 15px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
    }

    /* القائمة الجانبية (يمين) */
    .sidebar {
        width: 270px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    @media (max-width: 900px) {
        .sidebar { width: 100%; }
    }

    .sidebar-title {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--green);
        font-size: 13px;
        font-family: "Courier New", monospace;
        margin-bottom: 5px;
        font-weight: bold;
    }

    .sidebar-line {
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    .tabs {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .tab {
        background: #050a08;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 10px 14px;
        border-radius: 8px;
        text-align: right;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .tab:hover {
        border-color: var(--green);
        color: var(--green);
    }

    .tab.active {
        background: #0a1f14;
        border-color: var(--green);
        color: var(--green);
        font-weight: bold;
        box-shadow: 0 0 10px rgba(0,255,136,0.15);
    }

    .count {
        background: rgba(0,255,136,0.15);
        color: var(--green);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 11px;
    }

    /* الجداول والتصميمات الداخلية */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--border); padding: 10px; text-align: right; }
    th { background: #050a08; color: var(--yellow); }
    tr:hover { background: rgba(255,255,255,0.02); }

    .back-btn {
        background: #050a08;
        color: var(--green);
        border: 1px solid var(--border);
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        margin-bottom: 12px;
    }

    /* شبكة الصور */
    .images-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
    }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <div class="brand-icon">👻</div>
                <h1>GHOST SPY</h1>
            </div>

            <div id="deviceNameDisplay" class="device-name-display">لا يوجد جهاز محدد</div>

            <div class="device-selector">
                <select id="deviceSelect" onchange="selectDevice(this.value)">
                    <option value="">اختر الجهاز...</option>
                </select>
                <button onclick="deleteDevice()" class="delete-btn">🗑️ حذف</button>
                <button onclick="logout()" class="logout-btn">⏻ خروج</button>
            </div>
        </header>

        <div class="status-bar">
            <div class="status-item">
                <span class="label">الحالة:</span>
                <span id="networkStatus" class="value">غير متصل</span>
            </div>
            <div class="status-item">
                <span class="label">البطارية:</span>
                <span id="batteryStatus" class="value">—</span>
            </div>
            <div class="status-item">
                <span class="label">آخر اتصال:</span>
                <span id="lastSeen" class="value">—</span>
            </div>
        </div>

        <main class="dashboard-layout">
            <section class="tab-content">
                <div id="callsTab" class="tab-pane active">
                    <h3>📞 المكالمات</h3>
                    <div id="callsListView"></div>
                    <div id="callDetailView" style="display:none;">
                        <button onclick="backToCallsList()" class="back-btn">⬅️ رجوع</button>
                        <h4 id="callDetailTitle"></h4>
                        <div id="callDetailsList"></div>
                    </div>
                </div>

                <div id="smsTab" class="tab-pane">
                    <h3>💬 المحادثات</h3>
                    <div id="conversationsList"></div>
                    <div id="chatView" style="display:none;">
                        <button onclick="backToConversations()" class="back-btn">⬅️ رجوع</button>
                        <h4 id="chatTitle"></h4>
                        <div id="messagesList" class="messages-list"></div>
                    </div>
                </div>

                <div id="contactsTab" class="tab-pane">
                    <h3>👥 جهات الاتصال</h3>
                    <div id="contactsListView"></div>
                    <div id="contactDetailView" style="display:none;">
                        <button onclick="backToContactsList()" class="back-btn">⬅️ رجوع</button>
                        <div id="contactDetails"></div>
                    </div>
                </div>

                <div id="locationTab" class="tab-pane">
                    <h3>📍 الموقع</h3>
                    <div id="locationDetails"></div>
                </div>

                <div id="imagesTab" class="tab-pane">
                    <h3>🖼️ الصور</h3>
                    <div id="imagesGrid" class="images-grid"></div>
                </div>

                <div id="deletedTab" class="tab-pane">
                    <h3>🗑️ سلة المحذوفات</h3>
                    <div id="deletedList"></div>
                </div>

                <div id="whatsappTab" class="tab-pane">
                    <h3>💬 رسائل واتساب</h3>
                    <div id="whatsappList"></div>
                </div>

                <div id="appsTab" class="tab-pane">
                    <h3>📱 التطبيقات</h3>
                    <table id="appsTable">
                        <thead>
                            <tr><th>الاسم</th><th>الحزمة</th><th>نظام</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div id="deviceTab" class="tab-pane">
                    <h3>📊 الجهاز</h3>
                    <div id="deviceInfo"></div>
                </div>
            </section>

            <aside class="sidebar">
                <div class="sidebar-title">
                    <span class="sidebar-line"></span>
                    <span>GHOST MENU</span>
                    <span class="sidebar-line"></span>
                </div>

                <div class="tabs">
                    <button class="tab active" onclick="switchTab('device')">🖥️ معلومات الجهاز</button>
                    <button class="tab" onclick="switchTab('images')">🖼️ الصور <span id="imagesCount" class="count"></span></button>
                    <button class="tab" onclick="switchTab('sms')">💬 الرسائل <span id="smsCount" class="count"></span></button>
                    <button class="tab" onclick="switchTab('contacts')">👥 جهات الاتصال <span id="contactsCount" class="count"></span></button>
                    <button class="tab" onclick="switchTab('calls')">📞 المكالمات <span id="callCount" class="count"></span></button>
                    <button class="tab" onclick="switchTab('apps')">📱 التطبيقات <span id="appsCount" class="count"></span></button>
                    <button class="tab" onclick="switchTab('whatsapp')">💬 واتساب <span id="whatsappCount" class="count"></span></button>
                    <button class="tab" onclick="switchTab('deleted')">🗑️ المحذوفات <span id="deletedCount" class="count"></span></button>
                    <button class="tab" onclick="switchTab('location')">📍 الموقع</button>
                </div>
            </aside>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() { playSound(); });
    function playSound() {
        try {
            const audio = new Audio('v.wav');
            audio.volume = 1.0;
            audio.play();
        } catch (e) {}
    }
    </script>
</body>
</html>
