<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم النظام الهندسية</title>
    <style>
        :root {
            --bg: #0b0f12;
            --panel: #12181f;
            --border: #1e2631;
            --accent: #00ffcc;
            --yellow: #f39c12;
            --text: #e0e6ed;
            --muted: #8a99ad;
            --danger: #e74c3c;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Tahoma, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar h2 {
            color: var(--accent);
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
        }
        .device-selector {
            background: #161f28;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .device-selector select {
            width: 100%;
            background: var(--bg);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 4px;
            font-family: Tahoma;
        }
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .menu-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            text-align: right;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        .menu-btn.active, .menu-btn:hover {
            background: var(--accent);
            color: var(--bg);
            font-weight: bold;
            border-color: var(--accent);
        }
        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }
        .file-item {
            background: #161f28;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-item:hover {
            border-color: var(--accent);
        }
        .file-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .file-size {
            color: var(--yellow);
            font-size: 12px;
        }
        .download-btn {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .back-btn {
            background: #1e2631;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Dark Control</h2>
        <div class="device-selector">
            <label style="font-size: 12px; color: var(--muted); display: block; margin-bottom: 5px;">الهاتف المتصل:</label>
            <select id="deviceSelect" onchange="changeDevice()">
                <option value="">جاري البحث عن أجهزة...</option>
            </select>
            <div id="connectionStatus" style="font-size: 11px; margin-top: 5px; color: var(--danger);">● غير متصل</div>
        </div>
        <div class="menu-list">
            <button class="menu-btn active" onclick="switchTab('filemanager')">📂 تصفح ملفات الهاتف</button>
            <button class="menu-btn" onclick="switchTab('contacts')">📇 جهات الاتصال</button>
            <button class="menu-btn" onclick="switchTab('calls')">📞 سجل المكالمات</button>
            <button class="menu-btn" onclick="switchTab('messages')">📩 الرسائل القصيرة SMS</button>
            <button class="menu-btn" onclick="switchTab('deviceinfo')">📱 معلومات الهاتف</button>
        </div>
    </div>

    <div class="content">
        <!-- تبويب مدير الملفات -->
        <div id="filemanagerTab" class="tab-pane active">
            <h3>مدير ملفات الهاتف (تصفح حي)</h3>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div style="color: var(--yellow);">المسار الحالي: <span id="currentPath">/storage/emulated/0/</span></div>
                <button class="back-btn" onclick="goBack()">⬅ مجلد السابق</button>
            </div>
            <div id="fileListContainer">
                <!-- العناصر ستُعرض هنا برمجياً -->
            </div>
        </div>

        <!-- تبويبات البيانات الأخرى -->
        <div id="contactsTab" class="tab-pane"><h3>جهات الاتصال</h3><div id="contactsContent">جاري التحميل...</div></div>
        <div id="callsTab" class="tab-pane"><h3>سجل المكالمات</h3><div id="callsContent">جاري التحميل...</div></div>
        <div id="messagesTab" class="tab-pane"><h3>الرسائل القصيرة</h3><div id="messagesContent">جاري التحميل...</div></div>
        
        <!-- ** تبويب معلومات الهاتف ** -->
        <div id="deviceinfoTab" class="tab-pane">
            <h3>معلومات الهاتف</h3>
            <div id="deviceInfoContent">جاري التحميل...</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
