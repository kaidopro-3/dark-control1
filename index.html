<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم النظام الهندسية</title>
    <style>
        :root {
            --bg: #0b0f12;
            --panel: #12181f;
            --border: #1e2631;
            --accent: #00ffcc;
            --yellow: #f39c12;
            --text: #e0e6ed;
            --muted: #8a99ad;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Tahoma, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar h2 {
            color: var(--accent);
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
        }
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .menu-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            text-align: right;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        .menu-btn.active, .menu-btn:hover {
            background: var(--accent);
            color: var(--bg);
            font-weight: bold;
            border-color: var(--accent);
        }
        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }
        .file-item {
            background: #161f28;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .file-item:hover {
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Dark Control</h2>
        <div class="menu-list">
            <button class="menu-btn active" onclick="switchTab('filemanager')">📂 تصفح ملفات الهاتف</button>
            <button class="menu-btn" onclick="switchTab('contacts')">📇 جهات الاتصال</button>
            <button class="menu-btn" onclick="switchTab('calls')">📞 سجل المكالمات</button>
            <button class="menu-btn" onclick="switchTab('messages')">📩 الرسائل القصيرة SMS</button>
        </div>
    </div>

    <div class="content">
        <!-- تبويب مدير الملفات -->
        <div id="filemanagerTab" class="tab-pane active">
            <h3>مدير ملفات الهاتف (تصفح حي)</h3>
            <div style="margin-bottom: 15px; color: var(--yellow);">المسار الحالي: <span id="currentPath">/storage/emulated/0/</span></div>
            <div id="fileListContainer">
                <div class="file-item" onclick="openPath('/storage/emulated/0/Download/')">
                    <span>📁 Download</span>
                    <span style="color: var(--muted);">مجلد</span>
                </div>
                <div class="file-item" onclick="openPath('/storage/emulated/0/DCIM/')">
                    <span>📁 DCIM</span>
                    <span style="color: var(--muted);">مجلد</span>
                </div>
            </div>
        </div>

        <!-- تبويبات البيانات الأخرى -->
        <div id="contactsTab" class="tab-pane"><h3>جهات الاتصال</h3><div id="contactsContent">جاري التحميل...</div></div>
        <div id="callsTab" class="tab-pane"><h3>سجل المكالمات</h3><div id="callsContent">جاري التحميل...</div></div>
        <div id="messagesTab" class="tab-pane"><h3>الرسائل القصيرة</h3><div id="messagesContent">جاري التحميل...</div></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
